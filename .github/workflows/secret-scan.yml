name: Secret scanning

# Phase D4 (bec-docs/docs/deploiement/deploiement-cobage.md) - ce dépôt n'a aucune CI
# jusqu'ici. Justifié malgré l'absence de code applicatif : fichiers .example (variables
# d'environnement) et configuration Docker/nginx, susceptibles de recevoir une vraie
# valeur par erreur (ex. un secret collé pendant une session de debug).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
