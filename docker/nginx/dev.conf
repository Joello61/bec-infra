# Pont de développement local - route /api/ vers le backend Symfony (PHP-FPM),
# /uploads/ vers les fichiers statiques uploadés (avatars), tout le reste vers le
# frontend Next.js. Cohérent avec bec-docs/docs/deploiement/deploiement-cobage.md (§2,
# §6.0). Patron de base repris de factu_sentinel/docker/nginx/default.conf.

client_max_body_size 20m;

# 127.0.0.11 : résolveur DNS interne de Docker. "valid=10s" + variable dans
# fastcgi_pass/proxy_pass (plutôt qu'un nom de service en dur) forcent nginx à
# réévaluer l'IP à chaque requête au lieu de résoudre une seule fois au démarrage et
# de garder l'IP indéfiniment en cache - constaté empiriquement en vérifiant cette
# phase : un "docker compose up -d --force-recreate backend" change l'IP interne du
# conteneur, et sans ceci nginx continue de router vers l'ancienne IP (502 "Connection
# refused"), déjà documenté pour le nginx de prod (deploiement-cobage.md §4.4) mais
# oublié ici lors de la première écriture - le même problème s'applique en dev.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name _;

    # Route de santé Symfony, volontairement hors du préfixe /api/ (src/Controller/
    # HealthController.php:10, vérifié - déploiement-cobage.md §4.4 supposait /api/health,
    # écart à corriger dans ce document). Même bloc FastCGI que /api/ ci-dessous.
    location = /health {
        set $backend_upstream backend:9000;
        fastcgi_pass $backend_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param DOCUMENT_ROOT /app/public;
    }

    # Backend Symfony (API REST) - point d'entrée unique (front controller). SCRIPT_FILENAME
    # et DOCUMENT_ROOT sont figés sur le chemin interne du conteneur "backend" (WORKDIR /app
    # du Dockerfile) : ce conteneur nginx n'a jamais besoin d'accès au code source PHP,
    # uniquement au protocole FastCGI - sur le modèle exact de factu_sentinel (vérifié dans
    # son docker/nginx/default.conf).
    location /api/ {
        set $backend_upstream backend:9000;
        fastcgi_pass $backend_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param DOCUMENT_ROOT /app/public;
    }

    # Spécifique à Cobage (absent du patron factu_sentinel) : les avatars uploadés
    # (public/uploads/avatars/*) sont servis en fichiers statiques directement par nginx,
    # pas via une route Symfony dédiée (vérifié par grep sur les contrôleurs backend) -
    # nécessite donc, contrairement au bloc /api/ ci-dessus, un accès en lecture seule au
    # dossier réel (monté par bec-infra/docker-compose.yml).
    location /uploads/ {
        alias /usr/share/nginx/uploads/;
        try_files $uri =404;
    }

    # Frontend Next.js (App Router, "next dev --turbopack" en développement).
    location / {
        set $frontend_upstream http://frontend:3000;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Nécessaire au Hot Module Replacement de "next dev" en local.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
