# Overlay chargé UNIQUEMENT en production (docker/deploy/ssh-deploy.sh), jamais pour
# staging - Phase D5. "observability-shared" (socle partagé, github.com/Joello61/
# infrastructure) est explicitement production uniquement : la fusion de listes Compose
# est strictement additive (docker-compose.prod.yml, commentaire d'en-tête) - aucun
# override ne peut RETIRER un réseau ajouté dans un fichier de base, seul le fait de ne
# jamais charger ce fichier pour staging garantit l'exclusion.
#
# Bug réel déjà rencontré et corrigé chez factu_sentinel, évité ici dès le départ : si les
# deux environnements (staging/production) rejoignaient "observability-shared" via le même
# docker-compose.prod.yml partagé, leurs deux services "nginx" recevraient le même alias
# réseau générique ("nginx", ajouté automatiquement par Compose) - résolution DNS ambiguë
# côté Prometheus, jetons de scrape de deux environnements différents en collision.
#
# Usage (ssh-deploy.sh, uniquement quand ENVIRONMENT=production) :
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     -f docker-compose.prod.traefik.yml -f docker-compose.prod.observability.yml up -d

services:
  nginx:
    networks:
      - observability-shared

  # "default" doit être répété explicitement ici (contrairement à "nginx" ci-dessus, qui
  # l'a déjà dans docker-compose.prod.yml) : dès qu'UN SEUL fichier de la fusion déclare
  # une liste "networks:" pour un service, Compose cesse d'ajouter implicitement "default"
  # à ce service, quel que soit le fichier qui a déclenché cette liste explicite (vérifié
  # avec "docker compose config", même piège déjà documenté par factu_sentinel). Sans
  # "default" ici, "backend"/"worker"/"scheduler" perdraient toute connexion à "postgres"/
  # "mercure" en production.
  backend:
    networks:
      - default
      - observability-shared

  worker:
    networks:
      - default
      - observability-shared

  scheduler:
    networks:
      - default
      - observability-shared

networks:
  observability-shared:
    external: true
